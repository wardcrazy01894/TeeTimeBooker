# Cancellation-monitor job — polls for newly available tee times every 10 minutes
# during 7 AM – 10 PM ET, on Saturdays and Sundays (the days when Mangrove Bay slots
# are being watched).
#
# DESIGN: Each run of this workflow performs exactly ONE availability check and exits.
# The polling loop is handled externally by this cron schedule. The WatchOrchestrator
# inside `teetime watch` has no internal loop — it checks once and returns.
#
# DST NOTE: Unlike book.yml, this workflow does NOT need a DST-half gate because the
# watch job does not race a fixed wall-clock moment. The polling-hours gate (7 AM–10 PM
# course-local) is handled INSIDE the WatchOrchestrator via zoneinfo, not by the cron.
#
# The cron fires on Saturday and Sunday only (cron day 0=Sunday, 6=Saturday).
# WatchOrchestrator gates on polling hours internally (7 AM–10 PM ET) — no hour-gating
# in the cron to avoid DST complexity. Weekday runs are not needed; Mangrove Bay slots
# are only watched on the days they were booked (weekends).
#
# CONCURRENCY: Uses its own concurrency group (watch-tee-time) separate from
# book-tee-time. This prevents two watch runs from overlapping; it does NOT prevent
# a watch run from overlapping with a book run — those use separate groups. The
# advisory lock inside WatchOrchestrator handles that case correctly.
#
name: watch-tee-time

on:
  # Fires every 10 minutes on Saturdays and Sundays. WatchOrchestrator gates on
  # polling hours internally (7 AM–10 PM ET) via zoneinfo — no DST-half gate needed.
  # See PLAN.md §20 for the polling-hours rationale.
  schedule:
    - cron: "*/10 * * * 0,6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, check availability but do not book"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      target_date:
        description: "Date to watch (YYYY-MM-DD). If omitted, derived from store."
        required: false
        default: ""

# Separate concurrency group from book-tee-time. Two watch runs must not overlap.
# A watch run and a book run CAN be co-scheduled — the advisory lock inside
# WatchOrchestrator handles mutual exclusion at the booking level.
concurrency:
  group: watch-tee-time
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: America/New_York
      MB_USERNAME: ${{ secrets.MB_USERNAME }}
      MB_PASSWORD: ${{ secrets.MB_PASSWORD }}
      PLAYER1_EMAIL: ${{ secrets.PLAYER1_EMAIL }}
      PLAYER1_PHONE: ${{ secrets.PLAYER1_PHONE }}
      PLAYER1_MB_MEMBER: ${{ secrets.PLAYER1_MB_MEMBER }}
      PLAYER2_EMAIL: ${{ secrets.PLAYER2_EMAIL }}
      PLAYER3_EMAIL: ${{ secrets.PLAYER3_EMAIL }}
      PLAYER4_EMAIL: ${{ secrets.PLAYER4_EMAIL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: uv sync
        run: uv sync

      # Restore watch state (shared SQLite DB with main booking job via same cache key).
      # Shared with the main booking job — see PLAN.md §20.1 Q1 (resolved: shared key).
      - name: Restore state cache
        id: state-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: state/
          key: teetime-state-v1

      - name: Run watch check
        # Security: workflow_dispatch inputs are passed via step-level env vars
        # (not interpolated into the shell script body) to prevent template
        # injection. DATE_ARGS is a bash array so an empty target_date passes
        # zero extra arguments rather than an empty string.
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TARGET_DATE: ${{ github.event.inputs.target_date }}
        run: |
          mkdir -p state
          DATE_ARGS=()
          if [ -n "$TARGET_DATE" ]; then
            DATE_ARGS=(--date "$TARGET_DATE")
          fi
          uv run teetime watch \
            --config config/example.toml \
            --dry-run "$DRY_RUN" \
            "${DATE_ARGS[@]}"

      - name: Save state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/
          key: teetime-state-v1

      - name: Upload state diff (forensic artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teetime-watch-state
          path: state/
          if-no-files-found: ignore
