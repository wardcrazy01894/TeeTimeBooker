# azure-iac.yml — IaC validation and deployment for TeeTimeBooker v1 Azure infra.
#
# This is the ACTIVE workflow (GitHub only runs workflows under .github/workflows/).
#
# Triggers:
#   pull_request (matched paths) -> bicep build + what-if (advisory)
#   push to main (matched paths) -> AUTO-DEPLOY to dev (NO approval gate)
#   workflow_dispatch (environment=dev|prod) -> deploy chosen env
#   tag infra/v*                 -> deploy to prod (manual approval via environment)
#
# Auth: OIDC federated credentials (no client secret).
# Repo secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.
#
# IMPORTANT: parameters are passed INLINE (not via a .bicepparam file). A
# .bicepparam must NOT be combined with --template-file or an @file reference;
# doing so makes `az` parse the Bicep params file as JSON and fail. The
# .bicepparam files under infra/bicep/ remain for manual/local deploys.
#
# dev:  dryRun=true (no real bookings), enablePurgeProtection=false (iteration).
# prod: dryRun=false, enablePurgeProtection=true. prod is manual + gated.

name: azure-iac

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'src/**'
      - 'config/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/azure-iac.yml'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - 'src/**'
      - 'config/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/azure-iac.yml'
    tags:
      - 'infra/v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: azure-iac-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AZURE_LOCATION: eastus2

jobs:
  # ---------------------------------------------------------------------------
  # validate — PR only. Read-only: bicep build + advisory what-if. NOTE: this job
  # is NOT a required check (it needs OIDC, which is unavailable on some PRs). The
  # authoritative merge-gating Bicep check is ci.yml's required `bicep lint` job.
  # ---------------------------------------------------------------------------
  validate:
    name: Bicep build + what-if (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      RESOURCE_GROUP: rg-teetime-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Azure login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Bicep build (lint) — advisory (real gate is ci.yml / bicep lint)
        run: az bicep build --file infra/bicep/main.bicep
      - name: Deployment what-if (advisory, never fails the PR)
        env:
          SHARED_ACR_RG: rg-teetime-shared
        run: |
          # dev is a non-owner env → it needs the shared ACR (in rg-teetime-shared) name + RG
          # to validate the cross-RG AcrPull. Resolve best-effort; advisory only.
          SHARED_ACR_NAME=$(az acr list -g "${SHARED_ACR_RG}" --query "[0].name" -o tsv 2>/dev/null || echo "")
          az deployment group what-if \
            --resource-group "${RESOURCE_GROUP}" \
            --template-file infra/bicep/main.bicep \
            --parameters envName=dev location="${AZURE_LOCATION}" \
                         kvSku=standard dryRun=true \
                         enablePurgeProtection=false \
                         sharedAcrName="${SHARED_ACR_NAME}" \
                         sharedAcrResourceGroup="${SHARED_ACR_RG}" \
                         containerImage='mcr.microsoft.com/k8se/quickstart-jobs:latest' \
            || true

  # ---------------------------------------------------------------------------
  # deploy-dev — AUTO-DEPLOY on push to main, or workflow_dispatch(environment=dev).
  # The 'dev' GitHub Environment must have NO required reviewers (auto-deploy).
  # Permanent dry-run: dryRun=true.
  # ---------------------------------------------------------------------------
  deploy-dev:
    name: Deploy to dev
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    runs-on: ubuntu-latest
    environment: dev
    env:
      RESOURCE_GROUP: rg-teetime-dev
      ENVNAME: dev
      DRY_RUN: "true"
      PURGE_PROT: "false"
      # Cost-killswitch arming (PR-KS1). CI passes params INLINE, so these MUST be
      # set here. The killswitch module is gated on envName=='dev', so it only deploys
      # in this dev job. ROLE GUID is non-secret config (a custom-role definition id).
      # EXCEPTION: the safety-latch params (killswitchFired / enableSchedules) are NOT
      # hardcoded here — they are parsed from main.bicepparam.${ENVNAME} at deploy time
      # (see "Read killswitch latch" step) so the checked-in latch is authoritative on
      # the auto-deploy path. Full-repo-scan finding H1.
      ENABLE_KILLSWITCH: "true"
      KILLSWITCH_RBAC_ROLE_ID: "3e2d5a14-96bd-4469-9f96-b9c3270aa9e6"
      # Shared-ACR consolidation: dev pulls from the single shared ACR in rg-teetime-shared
      # instead of creating its own. See AZURE_PLAN.md §2.1 / acr-pull-cross-rg.bicep.
      SHARED_ACR_RG: rg-teetime-shared
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Azure login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Ensure resource group (idempotent)
        run: az group create -n "${RESOURCE_GROUP}" -l "${AZURE_LOCATION}"
      - name: Bicep build (lint)
        run: az bicep build --file infra/bicep/main.bicep
      # Read the checked-in cost-killswitch safety latch from the .bicepparam file and
      # pass it inline below. CI does NOT deploy from the .bicepparam file (it can't be
      # combined with --template-file), so without this step killswitchFired/enableSchedules
      # would fall back to their bicep defaults and the latch would be inert on the path
      # that actually runs. Full-repo-scan finding H1 / COST_KILLSWITCH_PLAN.md §2/Item2.
      - name: Read killswitch latch from param file (authoritative)
        run: |
          PARAM_FILE="infra/bicep/main.bicepparam.${ENVNAME}"
          KSF=$(grep -E '^param killswitchFired *=' "${PARAM_FILE}" | grep -oE '(true|false)' | head -1)
          ENS=$(grep -E '^param enableSchedules *=' "${PARAM_FILE}" | grep -oE '(true|false)' | head -1)
          test -n "${KSF}" || { echo "::error::could not parse killswitchFired from ${PARAM_FILE}"; exit 1; }
          test -n "${ENS}" || { echo "::error::could not parse enableSchedules from ${PARAM_FILE}"; exit 1; }
          echo "KILLSWITCH_FIRED=${KSF}" >> "$GITHUB_ENV"
          echo "ENABLE_SCHEDULES=${ENS}" >> "$GITHUB_ENV"
          echo "Latch from ${PARAM_FILE}: killswitchFired=${KSF} enableSchedules=${ENS}"
      # Shared-ACR consolidation: dev no longer creates its own ACR — it pulls from the
      # SHARED ACR (in ${SHARED_ACR_RG}). Resolve it FIRST (it pre-exists, deployed separately);
      # then a two-pass deploy: pass 1 (bootstrap public image) stands up dev's resources +
      # the cross-RG AcrPull grant on the shared ACR; then build+push the dev image INTO the
      # shared ACR (the CI SP has Contributor on rg-teetime-shared); pass 2 re-points the job.
      - name: Resolve SHARED ACR (cross-RG; timing-independent)
        run: |
          ACR_LOGIN_SERVER=$(az acr list -g "${SHARED_ACR_RG}" --query "[0].loginServer" -o tsv)
          test -n "${ACR_LOGIN_SERVER}" || { echo "::error::No shared ACR in ${SHARED_ACR_RG}"; exit 1; }
          echo "ACR_LOGIN_SERVER=${ACR_LOGIN_SERVER}" >> "$GITHUB_ENV"
          echo "ACR_NAME=${ACR_LOGIN_SERVER%%.*}" >> "$GITHUB_ENV"
      - name: Deploy pass 1 (bootstrap image — dev resources + cross-RG AcrPull on shared ACR)
        run: |
          az deployment group create \
            --name "teetime-${ENVNAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --template-file infra/bicep/main.bicep \
            --parameters envName="${ENVNAME}" location="${AZURE_LOCATION}" \
                         kvSku=standard \
                         dryRun="${DRY_RUN}" enablePurgeProtection="${PURGE_PROT}" \
                         enableKillswitch="${ENABLE_KILLSWITCH}" \
                         killswitchRbacRoleId="${KILLSWITCH_RBAC_ROLE_ID}" \
                         killswitchFired="${KILLSWITCH_FIRED}" \
                         enableSchedules="${ENABLE_SCHEDULES}" \
                         sharedAcrName="${ACR_NAME}" \
                         sharedAcrResourceGroup="${SHARED_ACR_RG}" \
                         usePublicBootstrapImage=true \
                         containerImage='mcr.microsoft.com/k8se/quickstart-jobs:latest'
      # Dev pushes to a SEPARATE repo (teetime-dev) in the shared ACR — NOT prod's `teetime`
      # repo — so dev's high-frequency builds can never evict prod's pinned image via the
      # per-repo purge. See registry.bicep purge filter + AZURE_PLAN.md §2.1.
      - name: Build + push image to SHARED ACR (dev repo)
        run: az acr build -r "${ACR_NAME}" -t "teetime-dev:${{ github.sha }}" .
      - name: Deploy pass 2 (real image from shared ACR)
        run: |
          az deployment group create \
            --name "teetime-${ENVNAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --template-file infra/bicep/main.bicep \
            --parameters envName="${ENVNAME}" location="${AZURE_LOCATION}" \
                         kvSku=standard \
                         dryRun="${DRY_RUN}" enablePurgeProtection="${PURGE_PROT}" \
                         enableKillswitch="${ENABLE_KILLSWITCH}" \
                         killswitchRbacRoleId="${KILLSWITCH_RBAC_ROLE_ID}" \
                         killswitchFired="${KILLSWITCH_FIRED}" \
                         enableSchedules="${ENABLE_SCHEDULES}" \
                         sharedAcrName="${ACR_NAME}" \
                         sharedAcrResourceGroup="${SHARED_ACR_RG}" \
                         usePublicBootstrapImage=false \
                         containerImage="${ACR_LOGIN_SERVER}/teetime-dev:${{ github.sha }}"
      - name: Budget reminder (operator deploys manually — see AZURE_PLAN.md §9.2)
        # Budgets are subscription-scoped; the CI service principal is RG-scoped by
        # design (least privilege), so it cannot create them. The $20 email budget and
        # the $50 killswitch budget are deployed manually by the operator (the portal
        # path also sidesteps a known `az deployment sub create` budget-PUT bug). This
        # step is an explicit notice — it does NOT attempt (and fail) a deploy.
        run: echo "::notice::Budget is subscription-scoped and deployed manually by the operator; the CI service principal is RG-scoped by design. See AZURE_PLAN.md §9.2."

  # ---------------------------------------------------------------------------
  # deploy-prod — MANUAL ONLY (workflow_dispatch environment=prod, or infra/v* tag).
  # The 'prod' GitHub Environment has required reviewers (manual approval gate).
  # ---------------------------------------------------------------------------
  deploy-prod:
    name: Deploy to prod (manual approval)
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/infra/v'))
    runs-on: ubuntu-latest
    environment: prod
    env:
      RESOURCE_GROUP: rg-teetime-prod
      ENVNAME: prod
      DRY_RUN: "false"
      PURGE_PROT: "true"
      # Cost-killswitch: prod deploy NEVER creates a killswitch (the module is gated
      # on envName=='dev' in main.bicep, and the prod RBAC assignment is created by
      # the DEV deploy's cross-RG nested module). These are set false/empty only so
      # the shared inline-param block below expands to a valid bool/string in prod.
      ENABLE_KILLSWITCH: "false"
      KILLSWITCH_RBAC_ROLE_ID: ""
      # Shared-ACR consolidation: prod is now a NON-OWNER too — it pulls from the single shared
      # ACR in rg-teetime-shared (deployed separately) and pushes to the `teetime` repo there.
      SHARED_ACR_RG: rg-teetime-shared
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Azure login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Ensure resource group (idempotent)
        run: az group create -n "${RESOURCE_GROUP}" -l "${AZURE_LOCATION}"
      - name: Bicep build (lint)
        run: az bicep build --file infra/bicep/main.bicep
      # Read the checked-in cost-killswitch safety latch from the .bicepparam file and
      # pass it inline below. CI does NOT deploy from the .bicepparam file (it can't be
      # combined with --template-file), so without this step killswitchFired/enableSchedules
      # would fall back to their bicep defaults and the latch would be inert on the path
      # that actually runs. Full-repo-scan finding H1 / COST_KILLSWITCH_PLAN.md §2/Item2.
      - name: Read killswitch latch from param file (authoritative)
        run: |
          PARAM_FILE="infra/bicep/main.bicepparam.${ENVNAME}"
          KSF=$(grep -E '^param killswitchFired *=' "${PARAM_FILE}" | grep -oE '(true|false)' | head -1)
          ENS=$(grep -E '^param enableSchedules *=' "${PARAM_FILE}" | grep -oE '(true|false)' | head -1)
          test -n "${KSF}" || { echo "::error::could not parse killswitchFired from ${PARAM_FILE}"; exit 1; }
          test -n "${ENS}" || { echo "::error::could not parse enableSchedules from ${PARAM_FILE}"; exit 1; }
          echo "KILLSWITCH_FIRED=${KSF}" >> "$GITHUB_ENV"
          echo "ENABLE_SCHEDULES=${ENS}" >> "$GITHUB_ENV"
          echo "Latch from ${PARAM_FILE}: killswitchFired=${KSF} enableSchedules=${ENS}"
      # Shared-ACR consolidation: prod no longer creates its own ACR — it pulls from the
      # SHARED ACR (in ${SHARED_ACR_RG}, deployed separately). Resolve it FIRST; then a
      # two-pass deploy: pass 1 (bootstrap public image) stands up prod's resources + the
      # cross-RG AcrPull grant on the shared ACR; then build+push the prod image into the
      # shared ACR's `teetime` repo (separate from dev's `teetime-dev`); pass 2 re-points.
      - name: Resolve SHARED ACR (cross-RG; timing-independent)
        run: |
          ACR_LOGIN_SERVER=$(az acr list -g "${SHARED_ACR_RG}" --query "[0].loginServer" -o tsv)
          test -n "${ACR_LOGIN_SERVER}" || { echo "::error::No shared ACR in ${SHARED_ACR_RG}"; exit 1; }
          echo "ACR_LOGIN_SERVER=${ACR_LOGIN_SERVER}" >> "$GITHUB_ENV"
          echo "ACR_NAME=${ACR_LOGIN_SERVER%%.*}" >> "$GITHUB_ENV"
      - name: Deploy pass 1 (bootstrap image — prod resources + cross-RG AcrPull on shared ACR)
        run: |
          az deployment group create \
            --name "teetime-${ENVNAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --template-file infra/bicep/main.bicep \
            --parameters envName="${ENVNAME}" location="${AZURE_LOCATION}" \
                         kvSku=standard \
                         dryRun="${DRY_RUN}" enablePurgeProtection="${PURGE_PROT}" \
                         enableKillswitch="${ENABLE_KILLSWITCH}" \
                         killswitchRbacRoleId="${KILLSWITCH_RBAC_ROLE_ID}" \
                         killswitchFired="${KILLSWITCH_FIRED}" \
                         enableSchedules="${ENABLE_SCHEDULES}" \
                         sharedAcrName="${ACR_NAME}" \
                         sharedAcrResourceGroup="${SHARED_ACR_RG}" \
                         usePublicBootstrapImage=true \
                         containerImage='mcr.microsoft.com/k8se/quickstart-jobs:latest'
      - name: Build + push image to SHARED ACR (prod repo)
        run: az acr build -r "${ACR_NAME}" -t "teetime:${{ github.sha }}" .
      - name: Deploy pass 2 (real image from shared ACR)
        run: |
          az deployment group create \
            --name "teetime-${ENVNAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --template-file infra/bicep/main.bicep \
            --parameters envName="${ENVNAME}" location="${AZURE_LOCATION}" \
                         kvSku=standard \
                         dryRun="${DRY_RUN}" enablePurgeProtection="${PURGE_PROT}" \
                         enableKillswitch="${ENABLE_KILLSWITCH}" \
                         killswitchRbacRoleId="${KILLSWITCH_RBAC_ROLE_ID}" \
                         killswitchFired="${KILLSWITCH_FIRED}" \
                         enableSchedules="${ENABLE_SCHEDULES}" \
                         sharedAcrName="${ACR_NAME}" \
                         sharedAcrResourceGroup="${SHARED_ACR_RG}" \
                         usePublicBootstrapImage=false \
                         containerImage="${ACR_LOGIN_SERVER}/teetime:${{ github.sha }}"
      - name: Budget reminder (operator deploys manually — see AZURE_PLAN.md §9.2)
        # Budgets are subscription-scoped; the CI service principal is RG-scoped by
        # design (least privilege), so it cannot create them. The $20 email budget and
        # the $50 killswitch budget are deployed manually by the operator (the portal
        # path also sidesteps a known `az deployment sub create` budget-PUT bug). This
        # step is an explicit notice — it does NOT attempt (and fail) a deploy.
        run: echo "::notice::Budget is subscription-scoped and deployed manually by the operator; the CI service principal is RG-scoped by design. See AZURE_PLAN.md §9.2."
