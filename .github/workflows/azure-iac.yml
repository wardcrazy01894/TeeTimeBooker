# azure-iac.yml — IaC validation and deployment for TeeTimeBooker v1 Azure infra.
#
# This is the ACTIVE workflow (GitHub only runs workflows under .github/workflows/).
#
# Triggers:
#   pull_request (matched paths) -> bicep build + what-if (advisory)
#   push to main (matched paths) -> AUTO-DEPLOY to dev (NO approval gate)
#   workflow_dispatch (environment=dev|prod) -> deploy chosen env
#   tag infra/v*                 -> deploy to prod (manual approval via environment)
#
# Auth: OIDC federated credentials (no client secret).
# Repo secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.
#
# IMPORTANT: parameters are passed INLINE (not via a .bicepparam file). A
# .bicepparam must NOT be combined with --template-file or an @file reference;
# doing so makes `az` parse the Bicep params file as JSON and fail. The
# .bicepparam files under infra/bicep/ remain for manual/local deploys.
#
# dev:  dryRun=true (no real bookings), enablePurgeProtection=false (iteration).
# prod: dryRun=false, enablePurgeProtection=true. prod is manual + gated.

name: azure-iac

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'src/**'
      - 'config/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/azure-iac.yml'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - 'src/**'
      - 'config/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/azure-iac.yml'
    tags:
      - 'infra/v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: azure-iac-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AZURE_LOCATION: eastus2

jobs:
  # ---------------------------------------------------------------------------
  # validate — PR only. Read-only: bicep build. NOTE: this job
  # is NOT a required check (it needs OIDC, which is unavailable on some PRs). The
  # authoritative merge-gating Bicep check is ci.yml's required `bicep lint` job.
  # ---------------------------------------------------------------------------
  validate:
    name: Bicep build (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RESOURCE_GROUP: rg-teetime-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Bicep build (lint) — advisory (real gate is ci.yml / bicep lint)
        run: az bicep build --file infra/bicep/main.bicep
      # The what-if that used to run here passed only the old core params and none of the
      # param-file values the deploy jobs parse (bookingMode, deployWebApp, emailCustomDomain*,
      # githubIssuesRepo, ...), so it previewed template defaults, not what dev deploys: a noisy
      # diff nobody could act on. Removed (full-repo scan 2026-09-30); run a what-if by hand with
      # the deploy job's parameters when a preview matters (read-only, agents may run it).

  # ---------------------------------------------------------------------------
  # deploy-dev — AUTO-DEPLOY on push to main, or workflow_dispatch(environment=dev).
  # The 'dev' GitHub Environment must have NO required reviewers (auto-deploy).
  # Permanent dry-run: dryRun=true.
  # ---------------------------------------------------------------------------
  deploy-dev:
    name: Deploy to dev
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: dev
    # Per ENV, not per ref: two runs against one resource group never overlap.
    concurrency:
      group: azure-iac-deploy-dev
      cancel-in-progress: false
    env:
      RESOURCE_GROUP: rg-teetime-dev
      ENVNAME: dev
      DRY_RUN: "true"
      PURGE_PROT: "false"
      # Cost-killswitch arming (PR-KS1). CI passes params INLINE, so these MUST be
      # set here. The killswitch module is gated on envName=='dev', so it only deploys
      # in this dev job. ROLE GUID is non-secret config (a custom-role definition id).
      # EXCEPTION: the safety-latch params (killswitchFired / enableSchedules) are NOT
      # hardcoded here — they are parsed from main.bicepparam.${ENVNAME} at deploy time
      # (see "Read killswitch latch" step) so the checked-in latch is authoritative on
      # the auto-deploy path. Full-repo-scan finding H1.
      ENABLE_KILLSWITCH: "true"
      KILLSWITCH_RBAC_ROLE_ID: "3e2d5a14-96bd-4469-9f96-b9c3270aa9e6"
      # Shared-ACR consolidation: dev pulls from the single shared ACR in rg-teetime-shared
      # instead of creating its own. See AZURE_PLAN.md §2.1 / acr-pull-cross-rg.bicep.
      SHARED_ACR_RG: rg-teetime-shared
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Ensure resource group (idempotent)
        run: az group create -n "${RESOURCE_GROUP}" -l "${AZURE_LOCATION}"
      - name: Bicep build (lint)
        run: az bicep build --file infra/bicep/main.bicep
      # Read the checked-in cost-killswitch safety latch from the .bicepparam file and
      # pass it inline below. CI does NOT deploy from the .bicepparam file (it can't be
      # combined with --template-file), so without this step killswitchFired/enableSchedules
      # would fall back to their bicep defaults and the latch would be inert on the path
      # that actually runs. Full-repo-scan finding H1 / docs/plans/COST_KILLSWITCH_PLAN.md §2/Item2.
      - name: Read killswitch latch from param file (authoritative)
        run: |
          PARAM_FILE="infra/bicep/main.bicepparam.${ENVNAME}"
          KSF=$(grep -E '^param killswitchFired *=' "${PARAM_FILE}" | grep -oE '(true|false)' | head -1)
          ENS=$(grep -E '^param enableSchedules *=' "${PARAM_FILE}" | grep -oE '(true|false)' | head -1)
          test -n "${KSF}" || { echo "::error::could not parse killswitchFired from ${PARAM_FILE}"; exit 1; }
          test -n "${ENS}" || { echo "::error::could not parse enableSchedules from ${PARAM_FILE}"; exit 1; }
          echo "KILLSWITCH_FIRED=${KSF}" >> "$GITHUB_ENV"
          echo "ENABLE_SCHEDULES=${ENS}" >> "$GITHUB_ENV"
          echo "Latch from ${PARAM_FILE}: killswitchFired=${KSF} enableSchedules=${ENS}"
          # MU-15a: every other value the param file sets must reach the deploy too, or it
          # silently falls back to the template default (dev's hourly watchCron did).
          # tests/test_azure_iac_killswitch_latch.py pins that each declared param is passed.
          python3 - "${PARAM_FILE}" >> "$GITHUB_ENV" <<'PY'
          import re, sys
          names = {"bookingMode": "BOOKING_MODE", "watchMode": "WATCH_MODE", "watchCron": "WATCH_CRON", "tenantCosmosEndpoint": "TENANT_COSMOS_ENDPOINT", "acsEmailSender": "ACS_EMAIL_SENDER", "deployWebApp": "DEPLOY_WEB_APP", "deployAcsEmail": "DEPLOY_ACS_EMAIL", "webPublicBaseUrl": "WEB_PUBLIC_BASE_URL", "operatorEmail": "OPERATOR_EMAIL", "webMinReplicas": "WEB_MIN_REPLICAS", "webCustomDomain": "WEB_CUSTOM_DOMAIN", "emailCustomDomain": "EMAIL_CUSTOM_DOMAIN", "emailCustomDomainLinked": "EMAIL_CUSTOM_DOMAIN_LINKED", "githubIssuesRepo": "GITHUB_ISSUES_REPO"}
          text = open(sys.argv[1]).read()
          for name, env in names.items():
              m = re.search(r"^param " + name + r"\s*=\s*(.+?)\s*$", text, re.M)
              if m is None:
                  sys.exit(f"::error::could not parse {name} from {sys.argv[1]}")
              value = m.group(1)
              if len(value) >= 2 and value[0] == value[-1] == "'":
                  value = value[1:-1]
              print(f"{env}={value}")
          PY
      # Shared-ACR consolidation: dev no longer creates its own ACR — it pulls from the
      # SHARED ACR (in ${SHARED_ACR_RG}). Resolve it FIRST (it pre-exists, deployed separately);
      # then a two-pass deploy: pass 1 (bootstrap public image) stands up dev's resources +
      # the cross-RG AcrPull grant on the shared ACR; then build+push the dev image INTO the
      # shared ACR (the CI SP has Contributor on rg-teetime-shared); pass 2 re-points the job.
      - name: Resolve SHARED ACR (cross-RG; timing-independent)
        run: |
          ACR_LOGIN_SERVER=$(az acr list -g "${SHARED_ACR_RG}" --query "[0].loginServer" -o tsv)
          test -n "${ACR_LOGIN_SERVER}" || { echo "::error::No shared ACR in ${SHARED_ACR_RG}"; exit 1; }
          echo "ACR_LOGIN_SERVER=${ACR_LOGIN_SERVER}" >> "$GITHUB_ENV"
          echo "ACR_NAME=${ACR_LOGIN_SERVER%%.*}" >> "$GITHUB_ENV"
      # Pass 1 is only for a NEW environment: its MI needs AcrPull on the shared ACR before
      # anything can pull the real image. Once the grant exists, pass 1 only doubled the deploy
      # time (~4 min) and put every job AND the web app on the placeholder image for a pass.
      # FAIL-SAFE: anything not confirmed (no identity, an az error, no assignment) runs pass 1.
      # az stderr stays in the log and the notice says why, so a permission regression that
      # silently brings pass 1 back is visible.
      # --assignee-object-id avoids a Graph lookup the RG-scoped CI SP may not be allowed.
      # Pinned by tests/test_azure_iac_bootstrap_skip.py (runs this script against a fake az).
      - name: Detect bootstrap need (skip pass 1 once the AcrPull grant exists)
        id: bootstrap
        run: |
          NEEDED=true
          PRINCIPAL=$(az identity show -g "${RESOURCE_GROUP}" -n "mi-teetime-${ENVNAME}" \
                        --query principalId -o tsv) || PRINCIPAL=""
          if [ -n "${PRINCIPAL}" ]; then
            ACR_ID=$(az acr show -n "${ACR_NAME}" -g "${SHARED_ACR_RG}" --query id -o tsv) || ACR_ID=""
            if [ -n "${ACR_ID}" ]; then
              N=$(az role assignment list --scope "${ACR_ID}" --assignee-object-id "${PRINCIPAL}" \
                    --role AcrPull --query "length(@)" -o tsv) || N=0
              if [ "${N:-0}" -ge 1 ] 2>/dev/null; then NEEDED=false; fi
            fi
          fi
          echo "needed=${NEEDED}" >> "$GITHUB_OUTPUT"
          echo "::notice::bootstrap pass 1 needed: ${NEEDED} (principal=${PRINCIPAL:-none} acr=${ACR_ID:+found} acrpull=${N:-unchecked})"
      - name: Deploy pass 1 (bootstrap image — dev resources + cross-RG AcrPull on shared ACR)
        if: steps.bootstrap.outputs.needed == 'true'
        run: |
          az deployment group create \
            --name "teetime-${ENVNAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --template-file infra/bicep/main.bicep \
            --parameters envName="${ENVNAME}" location="${AZURE_LOCATION}" \
                         kvSku=standard \
                         dryRun="${DRY_RUN}" enablePurgeProtection="${PURGE_PROT}" \
                         enableKillswitch="${ENABLE_KILLSWITCH}" \
                         killswitchRbacRoleId="${KILLSWITCH_RBAC_ROLE_ID}" \
                         killswitchFired="${KILLSWITCH_FIRED}" \
                         enableSchedules="${ENABLE_SCHEDULES}" \
                         bookingMode="${BOOKING_MODE}" \
                         watchMode="${WATCH_MODE}" \
                         watchCron="${WATCH_CRON}" \
                         tenantCosmosEndpoint="${TENANT_COSMOS_ENDPOINT}" \
                         acsEmailSender="${ACS_EMAIL_SENDER}" \
                         deployWebApp="${DEPLOY_WEB_APP}" \
                         deployAcsEmail="${DEPLOY_ACS_EMAIL}" \
                         webPublicBaseUrl="${WEB_PUBLIC_BASE_URL}" \
                         operatorEmail="${OPERATOR_EMAIL}" \
                         webMinReplicas="${WEB_MIN_REPLICAS}" \
                         webCustomDomain="${WEB_CUSTOM_DOMAIN}" \
                         emailCustomDomain="${EMAIL_CUSTOM_DOMAIN}" \
                         emailCustomDomainLinked="${EMAIL_CUSTOM_DOMAIN_LINKED}" \
                         githubIssuesRepo="${GITHUB_ISSUES_REPO}" \
                         sharedAcrName="${ACR_NAME}" \
                         sharedAcrResourceGroup="${SHARED_ACR_RG}" \
                         usePublicBootstrapImage=true \
                         containerImage='mcr.microsoft.com/k8se/quickstart-jobs:latest'
      # Dev pushes to a SEPARATE repo (teetime-dev) in the shared ACR — NOT prod's `teetime`
      # repo — so dev's high-frequency builds can never evict prod's pinned image via the
      # per-repo purge. See registry.bicep purge filter + AZURE_PLAN.md §2.1.
      - name: Build + push image to SHARED ACR (dev repo)
        run: az acr build -r "${ACR_NAME}" -t "teetime-dev:${{ github.sha }}" .
      - name: Deploy pass 2 (real image from shared ACR)
        run: |
          az deployment group create \
            --name "teetime-${ENVNAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --template-file infra/bicep/main.bicep \
            --parameters envName="${ENVNAME}" location="${AZURE_LOCATION}" \
                         kvSku=standard \
                         dryRun="${DRY_RUN}" enablePurgeProtection="${PURGE_PROT}" \
                         enableKillswitch="${ENABLE_KILLSWITCH}" \
                         killswitchRbacRoleId="${KILLSWITCH_RBAC_ROLE_ID}" \
                         killswitchFired="${KILLSWITCH_FIRED}" \
                         enableSchedules="${ENABLE_SCHEDULES}" \
                         bookingMode="${BOOKING_MODE}" \
                         watchMode="${WATCH_MODE}" \
                         watchCron="${WATCH_CRON}" \
                         tenantCosmosEndpoint="${TENANT_COSMOS_ENDPOINT}" \
                         acsEmailSender="${ACS_EMAIL_SENDER}" \
                         deployWebApp="${DEPLOY_WEB_APP}" \
                         deployAcsEmail="${DEPLOY_ACS_EMAIL}" \
                         webPublicBaseUrl="${WEB_PUBLIC_BASE_URL}" \
                         operatorEmail="${OPERATOR_EMAIL}" \
                         webMinReplicas="${WEB_MIN_REPLICAS}" \
                         webCustomDomain="${WEB_CUSTOM_DOMAIN}" \
                         emailCustomDomain="${EMAIL_CUSTOM_DOMAIN}" \
                         emailCustomDomainLinked="${EMAIL_CUSTOM_DOMAIN_LINKED}" \
                         githubIssuesRepo="${GITHUB_ISSUES_REPO}" \
                         sharedAcrName="${ACR_NAME}" \
                         sharedAcrResourceGroup="${SHARED_ACR_RG}" \
                         usePublicBootstrapImage=false \
                         containerImage="${ACR_LOGIN_SERVER}/teetime-dev:${{ github.sha }}"
      # MU-16a: run the tenant data migrations (MULTIUSER_PLAN §10.1/§10.2) — ONLY when this env
      # runs a tenant mode, so today's toml deploys are untouched (compute.bicep creates the
      # Manual `teetime-migrate-<env>` job only then). It runs right AFTER pass 2, not before the
      # jobs switch image: pass 1 (when it runs, on a new env) puts EVERY job on the bootstrap image,
      # so the migration can only run the real code once pass 2 has also switched the booking/watch
      # jobs and the web. Safe because readers accept schemaVersion N and N-1 (§10.2), and v1 ships
      # no migration at all. A failed or timed-out execution fails the deploy job.
      - name: Run tenant migrations (tenant mode only)
        if: env.BOOKING_MODE == 'tenant' || env.WATCH_MODE == 'tenant'
        run: |
          JOB="teetime-migrate-${ENVNAME}"
          # A transient Azure API error (2026-09-29: "Connection reset by peer" on the start
          # call) must not fail the deploy: retry the START, and let a failed status poll cost one
          # poll, not the step. Re-starting is safe: the migrations are an ordered, idempotent list
          # (MULTIUSER_PLAN §10.2). Pinned by tests/test_azure_iac_migrate_step.py.
          EXEC=""
          for attempt in 1 2 3; do
            if EXEC=$(az containerapp job start -n "${JOB}" -g "${RESOURCE_GROUP}" --query name -o tsv) \
               && [ -n "${EXEC}" ]; then
              break
            fi
            # The error may have come AFTER the start landed: follow an execution that is running
            # or still starting (Processing / Pending) rather than start a second, concurrent run.
            EXEC=$(az containerapp job execution list -n "${JOB}" -g "${RESOURCE_GROUP}" \
                     --query "[?contains(['Running','Processing','Pending'], properties.status)] | [0].name" -o tsv) || EXEC=""
            [ "${EXEC}" = None ] && EXEC=""  # az prints nothing today; never adopt a "None"
            if [ -n "${EXEC}" ]; then
              echo "::warning::start of ${JOB} errored but execution ${EXEC} is running; following it"
              break
            fi
            echo "::warning::starting ${JOB} failed (attempt ${attempt}/3)"
            [ "${attempt}" -lt 3 ] && sleep "${MIGRATE_RETRY_SLEEP_S:-15}"
          done
          test -n "${EXEC}" || { echo "::error::could not start ${JOB} after 3 attempts"; exit 1; }
          echo "Started ${JOB} execution ${EXEC}"
          STATUS=""
          for _ in $(seq 1 90); do
            STATUS=$(az containerapp job execution show -n "${JOB}" -g "${RESOURCE_GROUP}" \
                       --job-execution-name "${EXEC}" --query properties.status -o tsv) \
              || STATUS="(status query failed)"
            case "${STATUS}" in
              Succeeded) echo "${JOB} ${EXEC}: Succeeded"; exit 0 ;;
              Failed|Stopped|Degraded) echo "::error::${JOB} ${EXEC}: ${STATUS}"; exit 1 ;;
            esac
            sleep "${MIGRATE_POLL_SLEEP_S:-10}"
          done
          echo "::error::${JOB} ${EXEC}: still '${STATUS}' after 15 min"
          exit 1
      - name: Budget reminder (operator deploys manually — see AZURE_PLAN.md §9.2)
        # Budgets are subscription-scoped; the CI service principal is RG-scoped by
        # design (least privilege), so it cannot create them. The $20 email budget and
        # the $50 killswitch budget are deployed manually by the operator (the portal
        # path also sidesteps a known `az deployment sub create` budget-PUT bug). This
        # step is an explicit notice — it does NOT attempt (and fail) a deploy.
        run: echo "::notice::Budget is subscription-scoped and deployed manually by the operator; the CI service principal is RG-scoped by design. See AZURE_PLAN.md §9.2."

  # ---------------------------------------------------------------------------
  # deploy-prod — MANUAL ONLY (workflow_dispatch environment=prod, or infra/v* tag).
  # The 'prod' GitHub Environment has required reviewers (manual approval gate).
  # ---------------------------------------------------------------------------
  deploy-prod:
    name: Deploy to prod (manual approval)
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/infra/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: prod
    # Per ENV, not per ref: a tag push and a dispatch both deploy rg-teetime-prod.
    concurrency:
      group: azure-iac-deploy-prod
      cancel-in-progress: false
    env:
      RESOURCE_GROUP: rg-teetime-prod
      ENVNAME: prod
      DRY_RUN: "false"
      PURGE_PROT: "true"
      # Cost-killswitch: prod deploy NEVER creates a killswitch (the module is gated
      # on envName=='dev' in main.bicep, and the prod RBAC assignment is created by
      # the DEV deploy's cross-RG nested module). These are set false/empty only so
      # the shared inline-param block below expands to a valid bool/string in prod.
      ENABLE_KILLSWITCH: "false"
      KILLSWITCH_RBAC_ROLE_ID: ""
      # Shared-ACR consolidation: prod is now a NON-OWNER too — it pulls from the single shared
      # ACR in rg-teetime-shared (deployed separately) and pushes to the `teetime` repo there.
      SHARED_ACR_RG: rg-teetime-shared
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history: the guard below walks main's ancestry
      # Only code that reached main (so passed its required checks) may go to prod. A tag on a
      # side-branch commit or a dispatch from a feature branch is refused before any Azure call.
      # The GitHub `prod` environment also allows only main + infra/v* tags (repo setting).
      - name: Refuse a commit that is not on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_SHA} is not on main; prod deploys only code that reached main"
            exit 1
          fi
      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Ensure resource group (idempotent)
        run: az group create -n "${RESOURCE_GROUP}" -l "${AZURE_LOCATION}"
      - name: Bicep build (lint)
        run: az bicep build --file infra/bicep/main.bicep
      # Read the checked-in cost-killswitch safety latch from the .bicepparam file and
      # pass it inline below. CI does NOT deploy from the .bicepparam file (it can't be
      # combined with --template-file), so without this step killswitchFired/enableSchedules
      # would fall back to their bicep defaults and the latch would be inert on the path
      # that actually runs. Full-repo-scan finding H1 / docs/plans/COST_KILLSWITCH_PLAN.md §2/Item2.
      - name: Read killswitch latch from param file (authoritative)
        run: |
          PARAM_FILE="infra/bicep/main.bicepparam.${ENVNAME}"
          KSF=$(grep -E '^param killswitchFired *=' "${PARAM_FILE}" | grep -oE '(true|false)' | head -1)
          ENS=$(grep -E '^param enableSchedules *=' "${PARAM_FILE}" | grep -oE '(true|false)' | head -1)
          test -n "${KSF}" || { echo "::error::could not parse killswitchFired from ${PARAM_FILE}"; exit 1; }
          test -n "${ENS}" || { echo "::error::could not parse enableSchedules from ${PARAM_FILE}"; exit 1; }
          echo "KILLSWITCH_FIRED=${KSF}" >> "$GITHUB_ENV"
          echo "ENABLE_SCHEDULES=${ENS}" >> "$GITHUB_ENV"
          echo "Latch from ${PARAM_FILE}: killswitchFired=${KSF} enableSchedules=${ENS}"
          # MU-15a: every other value the param file sets must reach the deploy too, or it
          # silently falls back to the template default (dev's hourly watchCron did).
          # tests/test_azure_iac_killswitch_latch.py pins that each declared param is passed.
          python3 - "${PARAM_FILE}" >> "$GITHUB_ENV" <<'PY'
          import re, sys
          names = {"bookingMode": "BOOKING_MODE", "watchMode": "WATCH_MODE", "watchCron": "WATCH_CRON", "tenantCosmosEndpoint": "TENANT_COSMOS_ENDPOINT", "acsEmailSender": "ACS_EMAIL_SENDER", "deployWebApp": "DEPLOY_WEB_APP", "deployAcsEmail": "DEPLOY_ACS_EMAIL", "webPublicBaseUrl": "WEB_PUBLIC_BASE_URL", "operatorEmail": "OPERATOR_EMAIL", "webMinReplicas": "WEB_MIN_REPLICAS", "webCustomDomain": "WEB_CUSTOM_DOMAIN", "emailCustomDomain": "EMAIL_CUSTOM_DOMAIN", "emailCustomDomainLinked": "EMAIL_CUSTOM_DOMAIN_LINKED", "githubIssuesRepo": "GITHUB_ISSUES_REPO"}
          text = open(sys.argv[1]).read()
          for name, env in names.items():
              m = re.search(r"^param " + name + r"\s*=\s*(.+?)\s*$", text, re.M)
              if m is None:
                  sys.exit(f"::error::could not parse {name} from {sys.argv[1]}")
              value = m.group(1)
              if len(value) >= 2 and value[0] == value[-1] == "'":
                  value = value[1:-1]
              print(f"{env}={value}")
          PY
      # Shared-ACR consolidation: prod no longer creates its own ACR — it pulls from the
      # SHARED ACR (in ${SHARED_ACR_RG}, deployed separately). Resolve it FIRST; then a
      # two-pass deploy: pass 1 (bootstrap public image) stands up prod's resources + the
      # cross-RG AcrPull grant on the shared ACR; then build+push the prod image into the
      # shared ACR's `teetime` repo (separate from dev's `teetime-dev`); pass 2 re-points.
      - name: Resolve SHARED ACR (cross-RG; timing-independent)
        run: |
          ACR_LOGIN_SERVER=$(az acr list -g "${SHARED_ACR_RG}" --query "[0].loginServer" -o tsv)
          test -n "${ACR_LOGIN_SERVER}" || { echo "::error::No shared ACR in ${SHARED_ACR_RG}"; exit 1; }
          echo "ACR_LOGIN_SERVER=${ACR_LOGIN_SERVER}" >> "$GITHUB_ENV"
          echo "ACR_NAME=${ACR_LOGIN_SERVER%%.*}" >> "$GITHUB_ENV"
      # Pass 1 is only for a NEW environment: its MI needs AcrPull on the shared ACR before
      # anything can pull the real image. Once the grant exists, pass 1 only doubled the deploy
      # time (~4 min) and put every job AND the web app on the placeholder image for a pass.
      # FAIL-SAFE: anything not confirmed (no identity, an az error, no assignment) runs pass 1.
      # az stderr stays in the log and the notice says why, so a permission regression that
      # silently brings pass 1 back is visible.
      # --assignee-object-id avoids a Graph lookup the RG-scoped CI SP may not be allowed.
      # Pinned by tests/test_azure_iac_bootstrap_skip.py (runs this script against a fake az).
      - name: Detect bootstrap need (skip pass 1 once the AcrPull grant exists)
        id: bootstrap
        run: |
          NEEDED=true
          PRINCIPAL=$(az identity show -g "${RESOURCE_GROUP}" -n "mi-teetime-${ENVNAME}" \
                        --query principalId -o tsv) || PRINCIPAL=""
          if [ -n "${PRINCIPAL}" ]; then
            ACR_ID=$(az acr show -n "${ACR_NAME}" -g "${SHARED_ACR_RG}" --query id -o tsv) || ACR_ID=""
            if [ -n "${ACR_ID}" ]; then
              N=$(az role assignment list --scope "${ACR_ID}" --assignee-object-id "${PRINCIPAL}" \
                    --role AcrPull --query "length(@)" -o tsv) || N=0
              if [ "${N:-0}" -ge 1 ] 2>/dev/null; then NEEDED=false; fi
            fi
          fi
          echo "needed=${NEEDED}" >> "$GITHUB_OUTPUT"
          echo "::notice::bootstrap pass 1 needed: ${NEEDED} (principal=${PRINCIPAL:-none} acr=${ACR_ID:+found} acrpull=${N:-unchecked})"
      - name: Deploy pass 1 (bootstrap image — prod resources + cross-RG AcrPull on shared ACR)
        if: steps.bootstrap.outputs.needed == 'true'
        run: |
          az deployment group create \
            --name "teetime-${ENVNAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --template-file infra/bicep/main.bicep \
            --parameters envName="${ENVNAME}" location="${AZURE_LOCATION}" \
                         kvSku=standard \
                         dryRun="${DRY_RUN}" enablePurgeProtection="${PURGE_PROT}" \
                         enableKillswitch="${ENABLE_KILLSWITCH}" \
                         killswitchRbacRoleId="${KILLSWITCH_RBAC_ROLE_ID}" \
                         killswitchFired="${KILLSWITCH_FIRED}" \
                         enableSchedules="${ENABLE_SCHEDULES}" \
                         bookingMode="${BOOKING_MODE}" \
                         watchMode="${WATCH_MODE}" \
                         watchCron="${WATCH_CRON}" \
                         tenantCosmosEndpoint="${TENANT_COSMOS_ENDPOINT}" \
                         acsEmailSender="${ACS_EMAIL_SENDER}" \
                         deployWebApp="${DEPLOY_WEB_APP}" \
                         deployAcsEmail="${DEPLOY_ACS_EMAIL}" \
                         webPublicBaseUrl="${WEB_PUBLIC_BASE_URL}" \
                         operatorEmail="${OPERATOR_EMAIL}" \
                         webMinReplicas="${WEB_MIN_REPLICAS}" \
                         webCustomDomain="${WEB_CUSTOM_DOMAIN}" \
                         emailCustomDomain="${EMAIL_CUSTOM_DOMAIN}" \
                         emailCustomDomainLinked="${EMAIL_CUSTOM_DOMAIN_LINKED}" \
                         githubIssuesRepo="${GITHUB_ISSUES_REPO}" \
                         sharedAcrName="${ACR_NAME}" \
                         sharedAcrResourceGroup="${SHARED_ACR_RG}" \
                         usePublicBootstrapImage=true \
                         containerImage='mcr.microsoft.com/k8se/quickstart-jobs:latest'
      - name: Build + push image to SHARED ACR (prod repo)
        run: az acr build -r "${ACR_NAME}" -t "teetime:${{ github.sha }}" .
      - name: Deploy pass 2 (real image from shared ACR)
        run: |
          az deployment group create \
            --name "teetime-${ENVNAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --template-file infra/bicep/main.bicep \
            --parameters envName="${ENVNAME}" location="${AZURE_LOCATION}" \
                         kvSku=standard \
                         dryRun="${DRY_RUN}" enablePurgeProtection="${PURGE_PROT}" \
                         enableKillswitch="${ENABLE_KILLSWITCH}" \
                         killswitchRbacRoleId="${KILLSWITCH_RBAC_ROLE_ID}" \
                         killswitchFired="${KILLSWITCH_FIRED}" \
                         enableSchedules="${ENABLE_SCHEDULES}" \
                         bookingMode="${BOOKING_MODE}" \
                         watchMode="${WATCH_MODE}" \
                         watchCron="${WATCH_CRON}" \
                         tenantCosmosEndpoint="${TENANT_COSMOS_ENDPOINT}" \
                         acsEmailSender="${ACS_EMAIL_SENDER}" \
                         deployWebApp="${DEPLOY_WEB_APP}" \
                         deployAcsEmail="${DEPLOY_ACS_EMAIL}" \
                         webPublicBaseUrl="${WEB_PUBLIC_BASE_URL}" \
                         operatorEmail="${OPERATOR_EMAIL}" \
                         webMinReplicas="${WEB_MIN_REPLICAS}" \
                         webCustomDomain="${WEB_CUSTOM_DOMAIN}" \
                         emailCustomDomain="${EMAIL_CUSTOM_DOMAIN}" \
                         emailCustomDomainLinked="${EMAIL_CUSTOM_DOMAIN_LINKED}" \
                         githubIssuesRepo="${GITHUB_ISSUES_REPO}" \
                         sharedAcrName="${ACR_NAME}" \
                         sharedAcrResourceGroup="${SHARED_ACR_RG}" \
                         usePublicBootstrapImage=false \
                         containerImage="${ACR_LOGIN_SERVER}/teetime:${{ github.sha }}"
      # MU-16a: run the tenant data migrations (MULTIUSER_PLAN §10.1/§10.2) — ONLY when this env
      # runs a tenant mode, so today's toml deploys are untouched (compute.bicep creates the
      # Manual `teetime-migrate-<env>` job only then). It runs right AFTER pass 2, not before the
      # jobs switch image: pass 1 (when it runs, on a new env) puts EVERY job on the bootstrap image,
      # so the migration can only run the real code once pass 2 has also switched the booking/watch
      # jobs and the web. Safe because readers accept schemaVersion N and N-1 (§10.2), and v1 ships
      # no migration at all. A failed or timed-out execution fails the deploy job.
      - name: Run tenant migrations (tenant mode only)
        if: env.BOOKING_MODE == 'tenant' || env.WATCH_MODE == 'tenant'
        run: |
          JOB="teetime-migrate-${ENVNAME}"
          # A transient Azure API error (2026-09-29: "Connection reset by peer" on the start
          # call) must not fail the deploy: retry the START, and let a failed status poll cost one
          # poll, not the step. Re-starting is safe: the migrations are an ordered, idempotent list
          # (MULTIUSER_PLAN §10.2). Pinned by tests/test_azure_iac_migrate_step.py.
          EXEC=""
          for attempt in 1 2 3; do
            if EXEC=$(az containerapp job start -n "${JOB}" -g "${RESOURCE_GROUP}" --query name -o tsv) \
               && [ -n "${EXEC}" ]; then
              break
            fi
            # The error may have come AFTER the start landed: follow an execution that is running
            # or still starting (Processing / Pending) rather than start a second, concurrent run.
            EXEC=$(az containerapp job execution list -n "${JOB}" -g "${RESOURCE_GROUP}" \
                     --query "[?contains(['Running','Processing','Pending'], properties.status)] | [0].name" -o tsv) || EXEC=""
            [ "${EXEC}" = None ] && EXEC=""  # az prints nothing today; never adopt a "None"
            if [ -n "${EXEC}" ]; then
              echo "::warning::start of ${JOB} errored but execution ${EXEC} is running; following it"
              break
            fi
            echo "::warning::starting ${JOB} failed (attempt ${attempt}/3)"
            [ "${attempt}" -lt 3 ] && sleep "${MIGRATE_RETRY_SLEEP_S:-15}"
          done
          test -n "${EXEC}" || { echo "::error::could not start ${JOB} after 3 attempts"; exit 1; }
          echo "Started ${JOB} execution ${EXEC}"
          STATUS=""
          for _ in $(seq 1 90); do
            STATUS=$(az containerapp job execution show -n "${JOB}" -g "${RESOURCE_GROUP}" \
                       --job-execution-name "${EXEC}" --query properties.status -o tsv) \
              || STATUS="(status query failed)"
            case "${STATUS}" in
              Succeeded) echo "${JOB} ${EXEC}: Succeeded"; exit 0 ;;
              Failed|Stopped|Degraded) echo "::error::${JOB} ${EXEC}: ${STATUS}"; exit 1 ;;
            esac
            sleep "${MIGRATE_POLL_SLEEP_S:-10}"
          done
          echo "::error::${JOB} ${EXEC}: still '${STATUS}' after 15 min"
          exit 1
      - name: Budget reminder (operator deploys manually — see AZURE_PLAN.md §9.2)
        # Budgets are subscription-scoped; the CI service principal is RG-scoped by
        # design (least privilege), so it cannot create them. The $20 email budget and
        # the $50 killswitch budget are deployed manually by the operator (the portal
        # path also sidesteps a known `az deployment sub create` budget-PUT bug). This
        # step is an explicit notice — it does NOT attempt (and fail) a deploy.
        run: echo "::notice::Budget is subscription-scoped and deployed manually by the operator; the CI service principal is RG-scoped by design. See AZURE_PLAN.md §9.2."
