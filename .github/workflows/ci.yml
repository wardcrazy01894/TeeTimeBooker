name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # -------------------------------------------------------------------------
  # Python: lint, type-check, and test
  # -------------------------------------------------------------------------
  test:
    name: test / lint / typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Verify lockfile is up to date
        run: uv lock --locked

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Tests (non-integration)
        run: uv run pytest -m "not integration"

  # -------------------------------------------------------------------------
  # Container: verify the Docker image builds
  # -------------------------------------------------------------------------
  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t teetime:ci .

  # -------------------------------------------------------------------------
  # IaC: validate Bicep templates (no Azure credentials required)
  # -------------------------------------------------------------------------
  bicep-lint:
    name: bicep lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep CLI
        run: az bicep install

      - name: Lint main template (+ all modules it imports)
        run: az bicep build --file infra/bicep/main.bicep

      - name: Lint budget template (subscription-scoped, separate entry point)
        run: az bicep build --file infra/bicep/modules/budget.bicep
