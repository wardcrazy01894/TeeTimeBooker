name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # -------------------------------------------------------------------------
  # Python: lint, type-check, and test
  # -------------------------------------------------------------------------
  test:
    name: test / lint / typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Matches the DEPLOYED interpreter (Dockerfile python:3.14-slim) and local dev
          # (uv resolves 3.14). requires-python/ruff/mypy keep the >=3.12 floor, but CI
          # must validate the version prod actually runs.
          python-version: "3.14"

      - name: Install uv
        # ALL actions in this repo are SHA-pinned (first-party included since 2026-07 —
        # azure/login does the OIDC token exchange, so a retagged release there is the
        # highest-value target): no action floats on a mutable tag. Dependabot
        # (.github/dependabot.yml, github-actions ecosystem) PRs the pin bumps.
        # enable-cache persists the uv cache across runs (keyed on uv.lock) so `uv sync`
        # doesn't re-download every dependency each CI run.
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Verify lockfile is up to date
        run: uv lock --locked

      - name: Install dependencies
        # Bare `uv sync` — dev deps are a PEP 735 dependency-group, which uv installs by
        # default. There are no extras left to pass --all-extras for.
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Tests (non-integration)
        run: uv run pytest -m "not integration"

      - name: Dependency vulnerability scan (pip-audit)
        # No --ignore-vuln: the gate is unsuppressed and must STAY that way. The previous
        # PYSEC-2026-196 exemption (pip 26.1.1) was retired when #191 bumped pip to 26.1.2,
        # per its own "remove this once uv ships pip >= 26.1.2" note. Re-adding an ignore
        # silently narrows the CVE gate — prefer bumping the dep; Dependabot now opens that
        # PR automatically for the uv ecosystem.
        run: uv run pip-audit

  # -------------------------------------------------------------------------
  # Secret scan: catch accidentally committed credentials
  # -------------------------------------------------------------------------
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history so gitleaks can scan all commits on the branch

      - name: Scan for secrets (gitleaks)
        # Pinned to a commit SHA (not the floating v3 tag): this third-party action runs
        # with GITHUB_TOKEN, so a retagged/compromised release must not silently run here.
        # SHA = gitleaks/gitleaks-action v3.0.0.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------------
  # Container: verify the Docker image builds
  # -------------------------------------------------------------------------
  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build container image
        run: docker build -t teetime:ci .

  # -------------------------------------------------------------------------
  # Container: smoke-test the bare "teetime" entrypoint resolves on PATH.
  # Mirrors exactly how ACA Jobs invoke the container (command: ['teetime']).
  # Catches regressions where venv is not on PATH (exit 128 crash-loop).
  # -------------------------------------------------------------------------
  docker-smoke:
    name: docker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build container image
        run: docker build -t teetime:ci .

      - name: Smoke-test bare teetime entrypoint (ACA parity)
        run: docker run --rm teetime:ci teetime --help

      - name: Smoke-test config load (show-config on the shipped container.toml)
        # `--help` proves the entrypoint resolves but exercises zero config/booking code.
        # show-config loads + redacts the SHIPPED config/container.toml, smoking the real
        # config-load path in the image (catches a missing runtime dep used only by a
        # subcommand). Dummy secrets satisfy the *_env refs (Player 1 only; guests are
        # name-only, skip-dates is fail-open). Asserts a redacted email is in the output.
        run: |
          docker run --rm \
            -e MB_USERNAME=ci -e MB_PASSWORD=ci \
            -e PLAYER1_EMAIL=ci@example.test -e PLAYER1_PHONE=000-000-0000 \
            -e PLAYER1_MB_MEMBER=00000 \
            teetime:ci teetime show-config --config /app/config/container.toml \
            | grep -q '"email": "\*\*\*"'

  # -------------------------------------------------------------------------
  # IaC: validate Bicep templates (no Azure credentials required)
  # -------------------------------------------------------------------------
  bicep-lint:
    name: bicep lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bicep CLI
        run: az bicep install

      - name: Lint main template (+ all modules it imports)
        run: az bicep build --file infra/bicep/main.bicep

      - name: Lint budget template (subscription-scoped, separate entry point)
        run: az bicep build --file infra/bicep/modules/budget.bicep

      - name: Lint registry template (shared-ACR standalone entry point)
        # registry.bicep is deployed manually to rg-teetime-shared (AZURE_PLAN §10.6) and is
        # NOT reached from main.bicep since the shared-ACR consolidation (#148-#150), so the
        # two builds above never compile it. Build it explicitly so a syntax/type regression
        # is caught in CI, not on the next rare manual shared-ACR deploy (full-repo-scan infra).
        run: az bicep build --file infra/bicep/modules/registry.bicep
