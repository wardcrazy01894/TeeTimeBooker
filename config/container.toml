# TeeTimeBooker — container runtime config (v1 Azure / Docker).
# Baked into the image. All secrets arrive as env vars via ACA secretRef;
# this file only wires env-var names and non-secret settings.
# See infra/AZURE_PLAN.md §7.3 for the full env var inventory.

[[courses]]
id      = "foreup:mangrove_bay"
adapter = "foreup.mangrove_bay"
username_env = "MB_USERNAME"
password_env = "MB_PASSWORD"
extra = { booking_class_id = "2149" }

[request]
target_offsets       = [7]
# Wanted booking days are DERIVED from the [[request.time_windows]] weekdays below
# (per-day windows, PERDAY_WINDOWS_PLAN). The booking job books `today + 7` only when that
# date's weekday has a window; the watcher checks each such weekday, one reservation per day.
holes                = 18
max_price_per_player = "60.00"
cart                 = "either"
course_preferences   = ["foreup:mangrove_bay"]
# Hard booking cutoff (LEADTIME_SKIP_PLAN F1): freeze a target date (no new booking AND no
# upgrade) once wall-clock passes 16:00 ET the day before it. The shipped default is identical;
# stated explicitly here because it is a safety-critical knob for the deployed job.
booking_cutoff       = { days_before = 1, time_of_day = 16:00:00 }
# No-redeploy "skip this day" (LEADTIME_SKIP_PLAN F2): env-var NAME only (never a literal date
# list). The VALUE is a comma/space-separated ISO date list. In prod TEETIME_SKIP_DATES is a
# Key Vault secret (TEETIME-SKIP-DATES) injected by ACA — edit it in the Azure Portal with NO
# redeploy. Unset/empty/malformed = no skips (fail-open). See infra/AZURE_PLAN.md §7.
skip_dates_env       = "TEETIME_SKIP_DATES"

# Always book a full foursome (4 slots) — matches how it ran locally.
# NOTE: ForeUP's booking POST only sends the player COUNT, not per-guest contact
# info (verified in courses/foreup/base.py book(): no email/name fields in the
# payload — same as the website, which never asks for guest emails). So the three
# guests are name-only; only Player 1 (the account holder) needs contact details.
# This means NO PLAYER2/3/4 KV secrets are required.
[[request.players]]
first_name        = "Alex"
last_name         = "Lancaster"
email_env         = "PLAYER1_EMAIL"
phone_env         = "PLAYER1_PHONE"
member_number_env = "PLAYER1_MB_MEMBER"

[[request.players]]
first_name = "Guest"
last_name  = "Player"

[[request.players]]
first_name = "Guest"
last_name  = "Player"

[[request.players]]
first_name = "Guest"
last_name  = "Player"

# One window per wanted day (Sat+Sun, same 08:45-10:00 morning window). Each window is tied
# to its weekday; the wanted booking days are derived from these. Multiple windows may share
# a weekday (best slot that day wins; list order = preference).
[[request.time_windows]]
weekday  = "saturday"
earliest = 08:45:00
latest   = 10:00:00

[[request.time_windows]]
weekday  = "sunday"
earliest = 08:45:00
latest   = 10:00:00

[scheduler]
timezone         = "America/New_York"
fire_time        = 06:00:00
early_arrival_ms = 500
poll_interval_ms = 250
max_poll_seconds = 30
# Race path (--wait): start the CAPTCHA solve this many seconds before T0 (explicit
# rather than relying on the code default of 120 — race-critical timing, NIT7).
captcha_prefetch_lead_s = 120
# Race path: pre-solve this many CAPTCHA tokens concurrently during the busy-wait so the
# first ranked candidate + the next N-1 fallbacks each fire instantly at T0 (RACE_PREWARM_PLAN §4.4).
captcha_prefetch_count = 3
# Blind-POST fan-out cap (BLIND_POST_PLAN.md §5): a blind-capable PRIMARY (Mangrove Bay) fires up
# to this many concurrent book POSTs for the top-N ranked in-window grid slots at T0, keeps the
# best, cancels the rest. The CAPTCHA prefetch scales to min(this, in-window grid count). 0 disables
# blind fan-out (single-POST race path). Bounded further by the pooled-token count at fire time.
# Set to 1 — burst-of-one (operator directive 2026-07-15; was 3, before that 12 = the full grid):
# ForeUP's "1 online reservation per day" rule 400-rejects every surplus POST once the first lands
# (live 2026-06-27/28 + 2026-07-11), so a burst >1 makes the winner first-processed rather than
# best-ranked and adds 2captcha cost + T0 footprint for nothing. 1 fires the single grid slot
# closest to the window midpoint; a miss falls to the sequential center-out fallback.
blind_post_max_count = 1
# Blind-POST 0-booked fallback reserve (RESEARCH_FALLBACK_PLAN.md §2 Q3): EXTRA CAPTCHA tokens
# pre-solved beyond the blind burst so the post-reguard FRESH search books with a fresh POOLED
# token instead of a ~75s inline solve. The 3 blind POSTs pop their tokens; these 2 REMAIN
# pooled for the fallback. Paid pre-T0 on every drop (incl. the happy path where they go
# unused). 0 = no reserve.
blind_post_fallback_token_reserve = 2

[notifier]
# Console only. The bot does not send email — booking confirmations come from
# the course directly. See PLAN.md §16 (M4 removed).
backend = "console"

# Cancellation-monitor job (M-feature-1). ENABLED for the v1 dev/prod watch job.
# With --dry-run true (dev) the watcher does ALL the looking/ranking/logging and
# suppresses ONLY the final booking POST (WatchOrchestrator returns DRY_RUN before
# the lock + POST). That is the intended dev posture: prove the poller works without
# booking. In prod (--dry-run false) the same code path books a found slot.
[watcher]
enabled            = true
poll_interval_s    = 600  # 10 minutes; must be >= 300 (anti-bot floor)
# No time-of-day gate (MULTIDAY PR4): the watcher polls every run so it sees the 6 AM drop
# + early-morning cancellations. Rate limiting is the cron cadence + the poll_interval floor.

# Auto-upgrade (M-feature-2). ENABLED. When the watcher finds a higher-ranked slot
# (closer to that day's window midpoint) than the current managed booking for a wanted
# day, it cancels and rebooks the better slot. Safe to run daily because the watch request
# is scoped per target date — each check only ever acts on its own date+window, never a
# drifting today+7. Real effect is prod-only: in dev (--dry-run true) the cancel/book POSTs
# are suppressed. priority_slots omitted → defaults to course_preferences order +
# the per-day time_windows (the midpoint ranking).
[one_booking_policy]
enabled = true
