# TeeTimeBooker — container runtime config (v1 Azure / Docker).
# Baked into the image. All secrets arrive as env vars via ACA secretRef;
# this file only wires env-var names and non-secret settings.
# See infra/AZURE_PLAN.md §7.3 for the full env var inventory.

[[courses]]
id      = "foreup:mangrove_bay"
adapter = "foreup.mangrove_bay"
username_env = "MB_USERNAME"
password_env = "MB_PASSWORD"
extra = { booking_class_id = "2149" }

[request]
target_offsets       = [7]
holes                = 18
max_price_per_player = "60.00"
cart                 = "either"
course_preferences   = ["foreup:mangrove_bay"]

# Always book a full foursome (4 slots) — matches how it ran locally.
# NOTE: ForeUP's booking POST only sends the player COUNT, not per-guest contact
# info (verified in courses/foreup/base.py book(): no email/name fields in the
# payload — same as the website, which never asks for guest emails). So the three
# guests are name-only; only Player 1 (the account holder) needs contact details.
# This means NO PLAYER2/3/4 KV secrets are required.
[[request.players]]
first_name        = "Alex"
last_name         = "Lancaster"
email_env         = "PLAYER1_EMAIL"
phone_env         = "PLAYER1_PHONE"
member_number_env = "PLAYER1_MB_MEMBER"

[[request.players]]
first_name = "Guest"
last_name  = "Player"

[[request.players]]
first_name = "Guest"
last_name  = "Player"

[[request.players]]
first_name = "Guest"
last_name  = "Player"

[[request.time_windows]]
earliest = 08:45:00
latest   = 10:00:00

[scheduler]
timezone         = "America/New_York"
fire_time        = 06:00:00
early_arrival_ms = 500
poll_interval_ms = 250
max_poll_seconds = 30

[notifier]
# Console only. The bot does not send email — booking confirmations come from
# the course directly. See PLAN.md §16 (M4 removed).
backend = "console"

# Cancellation-monitor job (M-feature-1). ENABLED for the v1 dev/prod watch job.
# With --dry-run true (dev) the watcher does ALL the looking/ranking/logging and
# suppresses ONLY the final booking POST (WatchOrchestrator returns DRY_RUN before
# the lock + POST). That is the intended dev posture: prove the poller works without
# booking. In prod (--dry-run false) the same code path books a found slot.
[watcher]
enabled            = true
poll_interval_s    = 600  # 10 minutes; must be >= 300 (anti-bot floor)
polling_start_hour = 7    # course-local; no polling before 7 AM ET
polling_end_hour   = 22   # course-local; no polling after 10 PM ET

# one_booking_policy is intentionally NOT enabled in M6 (see M6_PLAN.md §4.4): the
# watcher only logs/ranks newly available slots; cancel+rebook upgrades are a later,
# separately-verified step. Daily-watch + policy-on needs a target-date design fix first.
