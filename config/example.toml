# TeeTimeBooker — example config.
# Copy to config/local.toml (gitignored) and edit. Secrets live in env vars,
# referenced here by NAME (e.g. password_env = "MB_PASS"); never inline them.

[[courses]]
id = "foreup:mangrove_bay"
adapter = "foreup.mangrove_bay"
username_env = "MB_USERNAME"
password_env = "MB_PASSWORD"
extra = { booking_class_id = "2149" }

# Add additional ForeUP-backed courses here as siblings:
# [[courses]]
# id = "foreup:twin_brooks"
# adapter = "foreup.twin_brooks"
# username_env = "TB_USERNAME"
# password_env = "TB_PASSWORD"

# TeeItUp-backed course example (e.g. Sydney R. Marovitz, Chicago Park District).
# Card credentials are secrets: use the *_env convention so they resolve from env vars.
# [[courses]]
# id = "teeitup:sydney_marovitz"
# adapter = "teeitup.sydney_marovitz"
# username_env = "SM_USERNAME"
# password_env = "SM_PASSWORD"
# [courses.extra]  # all *_env values are resolved from environment variables at startup
# cvv_env               = "SM_CVV"
# card_number_env       = "SM_CARD_NUMBER"
# expiry_month_env      = "SM_EXPIRY_MONTH"
# expiry_year_env       = "SM_EXPIRY_YEAR"
# billing_address_env   = "SM_BILLING_ADDRESS"
# billing_postal_code_env = "SM_BILLING_POSTAL_CODE"

[request]
# Target dates are computed at run time from offsets (days from today, in the
# scheduler timezone). [7] = "always book 7 days out". The RequestId is derived
# from offsets (NOT resolved dates), so the same idempotency identity persists
# across weekend cron firings; the (RequestId, resolved_date) pair is the actual
# idempotency key. See PLAN.md §13.
target_offsets     = [7]
# Wanted booking days are DERIVED from the [[request.time_windows]] weekdays below — there
# is no separate target_weekdays list (PERDAY_WINDOWS_PLAN). The booking job books
# `today + offset` only when that date's weekday has a window; the watcher checks each such
# weekday, holding one reservation per day (best window).
holes              = 18
# Decimal-as-string. Pydantic coerces via Decimal(str) — no float drift.
max_price_per_player = "55.00"
cart               = "either"     # "either" | "cart" | "walking"
course_preferences = ["foreup:mangrove_bay"]
# Hard booking cutoff (LEADTIME_SKIP_PLAN F1): never create OR modify a booking for a target
# date once wall-clock passes `time_of_day` on the day `days_before` days before it. Default
# (shown) = 16:00 ET the day before, so you're never surprised by a last-minute booking.
booking_cutoff     = { days_before = 1, time_of_day = 16:00:00 }
# No-redeploy "skip this day" (LEADTIME_SKIP_PLAN F2): env-var NAME only. Set the named env var
# to a comma/space-separated ISO date list to skip those days, e.g.
#   export TEETIME_SKIP_DATES="2026-06-14, 2026-06-21"
# Unset/empty/malformed = no skips (never crashes). In the hosted deploy this is a Key Vault
# secret editable in the Azure Portal with no redeploy (see infra/AZURE_PLAN.md §7).
skip_dates_env     = "TEETIME_SKIP_DATES"

# Party size = len(players). Each player is one row. PII fields prefer env-var
# refs; inline only if you accept the file is gitignored.
[[request.players]]
first_name    = "Alex"
last_name     = "Lancaster"
email_env     = "PLAYER1_EMAIL"
phone_env     = "PLAYER1_PHONE"
member_number_env = "PLAYER1_MB_MEMBER"

[[request.players]]
first_name    = "Guest"
last_name     = "Player"
email_env     = "PLAYER2_EMAIL"

[[request.players]]
first_name    = "Guest"
last_name     = "Player"
email_env     = "PLAYER3_EMAIL"

[[request.players]]
first_name    = "Guest"
last_name     = "Player"
email_env     = "PLAYER4_EMAIL"

# One window per wanted day. Each window is TIED to a weekday; the wanted booking days are
# derived from these. The morning window targets the best slots at Mangrove Bay.
[[request.time_windows]]
weekday  = "saturday"
earliest = 08:45:00
latest   = 10:00:00

[[request.time_windows]]
weekday  = "sunday"
earliest = 08:45:00
latest   = 10:00:00

# Multiple windows on one day are allowed — the bot still holds at most ONE reservation that
# day, booked in whichever window yields the best slot. Window LIST ORDER is preference
# (earlier window preferred). Uncomment to also chase a Sunday afternoon slot:
# [[request.time_windows]]
# weekday  = "sunday"
# earliest = 17:00:00
# latest   = 19:00:00

[scheduler]
timezone               = "America/New_York"   # Mangrove Bay is in ET
fire_time              = 06:00:00              # local wall-clock; DST handled by zoneinfo
early_arrival_ms       = 500                   # land 0.5 s before T0
poll_interval_ms       = 250
max_poll_seconds       = 30                    # give up polling after this
captcha_prefetch_lead_s = 120                  # race path (--wait): start the CAPTCHA solve
                                               # this many seconds before T0 so book() at the
                                               # drop fires with a token already in hand
captcha_prefetch_count  = 3                    # race path: pre-solve this many tokens concurrently
                                               # so the first N ranked candidates each fire instantly
                                               # (RACE_PREWARM_PLAN §4.4)
blind_post_max_count    = 3                    # blind-POST fan-out cap (BLIND_POST_PLAN.md §5):
                                               # a blind-capable PRIMARY (Mangrove Bay) fires up to
                                               # this many concurrent book POSTs at T0, keeps the
                                               # best, cancels the rest; CAPTCHA prefetch scales to it.
                                               # 0 disables blind fan-out (single-POST race path).
                                               # 3 (2026-07-18, reverting 2026-07-15's burst-of-one;
                                               # earlier: 12): the top-3 concurrent POSTs hedge the T0
                                               # slot-race. Surplus POSTs past the first success bounce
                                               # on ForeUP's "1 reservation/day" rule (cancel-extras
                                               # handles it, live 2026-07-11); accepted cost for the
                                               # hedge. A total miss falls to the sequential fallback.
blind_post_fallback_token_reserve = 2          # blind-POST 0-booked fallback reserve
                                               # (RESEARCH_FALLBACK_PLAN.md §2 Q3): EXTRA CAPTCHA
                                               # tokens pre-solved beyond the blind burst so the
                                               # post-reguard FRESH search books with a fresh POOLED
                                               # token, not a ~75s inline solve. The blind POSTs pop
                                               # their tokens; these REMAIN pooled for the fallback.
                                               # Paid pre-T0 every drop (incl. happy path). 0 = off.
blind_post_stagger_ms   = [-500, -250, 250]    # blind-POST T0 stagger (STAGGER_PLAN.md): per-POST
                                               # fire offsets in MILLISECONDS relative to T0, paired
                                               # positionally with the RANKED blind slots, so the
                                               # burst SPANS ForeUP's release boundary instead of
                                               # point-sampling it. Makes the outcome pattern ordered
                                               # by offset: a clean cutoff = pre-open rejection, an
                                               # unordered one = a real race (the two are otherwise
                                               # indistinguishable — same 400 body, 1-second Date).
                                               # First entry = -early_arrival_ms so the rank-0 slot
                                               # keeps today's exact instant; offsets ascend with
                                               # rank so the "1 reservation/day" rule can only reject
                                               # a WORSE sibling. Surplus slots reuse the last offset.
                                               # [] = legacy simultaneous firing. Offsets earlier
                                               # than -early_arrival_ms are clamped + logged.

[notifier]
# Console only. The bot does not send email — booking confirmations come from
# the course directly (see PLAN.md §16, M4 removed). Results also print to the
# run log.
backend = "console"

# Cancellation-monitor job (M-feature-1). Disabled by default in this template.
# When enabled, `teetime watch` polls for newly available slots on the target
# date (useful after the 6 AM opening failed or to grab a better time).
# v1 dev/prod steady state: enabled = true (see config/container.toml). With
# --dry-run true the watcher looks/ranks/logs but never books.
[watcher]
enabled             = false
poll_interval_s     = 600   # 10 minutes; must be >= 300 (anti-bot floor)
# No time-of-day gate (MULTIDAY PR4): the watcher polls on every run.

# One-booking policy (M-feature-2). Disabled by default.
# When enabled, the watch job will cancel the current managed booking and rebook
# if a higher-priority slot (lower priority index) becomes available.
[one_booking_policy]
enabled = false

# Ordered list of preferred slots. priority=0 is most preferred.
# If this list is empty, defaults to [request].course_preferences order with
# [request].time_windows[0]. Within one priority level, the slot closest to
# the window midpoint wins (midpoint-distance sort, Feature 3).
#
# Example: prefer any 08:45-09:22 slot over any 09:22-10:00 slot.
# [[one_booking_policy.priority_slots]]
# priority              = 0
# course_id             = "foreup:mangrove_bay"
# time_window_earliest  = 08:45:00
# time_window_latest    = 09:22:00
#
# [[one_booking_policy.priority_slots]]
# priority              = 1
# course_id             = "foreup:mangrove_bay"
# time_window_earliest  = 09:22:00
# time_window_latest    = 10:00:00
