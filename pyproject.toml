[project]
name = "teetime"
version = "0.0.0"
description = "Automated tee-time booking bot (v0: Mangrove Bay / ForeUP)."
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Alex Lancaster" }]
license = { text = "Proprietary" }

# Runtime deps. Pinned loosely; lock via uv.lock once `uv sync` is run.
dependencies = [
    "httpx>=0.28.1",        # async-capable HTTP client; cleaner than requests
    "pydantic>=2.13.4",     # config + payload validation
    "click>=8.4.2",         # CLI
    # NOT imported directly — idna is transitive via httpx/anyio. Kept here ONLY as a
    # security floor so the resolver can never pick idna<3.15 (CVE-2026-45409, a ReDoS
    # fixed in 3.15). Floor now tracks the locked version (3.18); the CVE boundary is
    # still 3.15, so this stays a guard rather than a load-bearing requirement.
    "idna>=3.19",
    "ntplib>=0.4",          # best-effort NTP clock-offset for the 6 AM race (RealClock)
]

# Dev deps are a PEP 735 dependency-group, NOT a `[project.optional-dependencies]` extra.
# The distinction is load-bearing in two places:
#   1. Dependabot classifies an EXTRA as `dependency-type: production`, so the prod/dev
#      group split in .github/dependabot.yml silently collapsed — PR #193 put pytest, ruff,
#      mypy and pip-audit in the "python-runtime" group alongside click/idna. A group is
#      classified `development`, which makes that split actually work.
#   2. `uv sync --no-dev` (both Dockerfile stages) only excludes GROUPS. With an extra it
#      was decorative — the image stayed lean because extras are opt-in, not because
#      --no-dev did anything. Now it is the real mechanism keeping dev tooling out of prod.
# Consequence: a bare `uv sync` NOW installs dev deps (groups are on by default), which is
# what README/CLAUDE.md already claimed it did.
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",        # httpx mock for unit tests
    "ruff>=0.16.2",         # 0.16 promoted PLR0917 to stable + formats md — see [tool.ruff]
    "mypy>=2.3.0",          # 2.x strict defaults verified clean against this codebase
    "pip-audit>=2.10.1",    # dependency vulnerability scanning (CVE check)
]
# Removed (unused): vcrpy (cassettes were never recorded — the live-API drift canary in
# tests/test_foreup_canary.py replaced them); freezegun (the injectable FakeClock is used
# everywhere instead); tenacity (retry is hand-rolled in ForeUpAdapter._send_with_retry);
# structlog (the code uses stdlib logging, not structlog); types-pytz (the code uses
# zoneinfo, never pytz). See full-repo-scan dependency-hygiene finding.
# Removed playwright: the headless-browser reCAPTCHA solver was unreliable (Google's risk
# scorer rejected it) and the deployed image carried no browser binary — 2captcha is the
# only supported live solver now (a missing TWOCAPTCHA_API_KEY fails fast in live mode).

[project.scripts]
teetime = "teetime.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teetime"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# ruff 0.16 began formatting python code blocks INSIDE Markdown. Our plan docs quote
# FRAGMENTS (bare ctor params, partial class bodies), which ruff parses as standalone
# statements and rewrites incorrectly — it turned
#     booking_cutoff: BookingCutoffConfig | None = None,   # PR2
# into
#     booking_cutoff: BookingCutoffConfig | None = (None,)  # PR2
# i.e. a TUPLE, silently corrupting 8 ratified design docs. These are prose, not source;
# nothing imports them and no test executes them. Excluded so the formatter cannot rewrite
# documentation. Remove only if the snippets are ever made independently valid.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "PL", "ANN"]
ignore = [
    "PLR0913", # too many arguments
    # PLR0917 (too many POSITIONAL arguments) went STABLE in ruff 0.16 — it was preview-only
    # before, which is why it surfaced with the 0.15 -> 0.16 bump and not from new code.
    # It is deliberately NOT ignored globally: unlike PLR0913 it guards against argument
    # TRANSPOSITION, which mypy cannot catch when adjacent params share a type, and in a
    # booking system a transposed argument can mis-book. It is relaxed per-file below, only
    # where the flagged signature is a collaborator-injection ctor of all-distinct types.
    # The two genuinely risky production sites were fixed instead of suppressed: both
    # UpgradeOrchestrator._cancel_and_book_slot and ._persist_upgrade are now keyword-only
    # past their leading args (the latter takes TWO BookingResult params).
]

[tool.ruff.lint.per-file-ignores]
# Test date-builders take (year, month, day, hour, minute, second) — all int, so PLR0917 is
# correct that they are transposable, but a transposed date fails its own assertion loudly.
"tests/**" = ["ANN", "PLR2004", "E501", "PLR0917"]
# Collaborator-injection ctors (Orchestrator/WatchOrchestrator/UpgradeOrchestrator.__init__):
# every param is a distinct injected type, so a transposition fails mypy, not silently.
"src/teetime/core/orchestrator.py" = ["PLR0917"]
"src/teetime/core/watch_orchestrator.py" = ["PLR0917"]
"src/teetime/core/upgrade_orchestrator.py" = ["PLR0917"]
# book() is an 11-step sequential payment flow; its branch/statement count is by design.
"src/teetime/courses/teeitup/base.py" = ["PLR0912", "PLR0915"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["teetime"]
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["ntplib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: hits a live external service (skipped by default)",
]

