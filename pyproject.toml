[project]
name = "teetime"
version = "0.0.0"
description = "Automated tee-time booking bot (v0: Mangrove Bay / ForeUP)."
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Alex Lancaster" }]
license = { text = "Proprietary" }

# Runtime deps. Pinned loosely; lock via uv.lock once `uv sync` is run.
dependencies = [
    "httpx>=0.27",          # async-capable HTTP client; cleaner than requests
    "pydantic>=2.7",        # config + payload validation
    "tenacity>=8.3",        # retry policies
    "structlog>=24.1",      # structured logging
    "click>=8.1",           # CLI
    "playwright>=1.37",     # headless browser for reCAPTCHA v2 invisible token harvest
    "idna>=3.15",           # CVE-2026-45409 fixed in 3.15; transitive via httpx
    "ntplib>=0.4",          # best-effort NTP clock-offset for the 6 AM race (RealClock)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",          # httpx mock for unit tests
    "ruff>=0.5",
    "mypy>=2.0",            # 2.x strict defaults verified clean against this codebase
    "types-pytz",
    "pip-audit>=2.10",      # dependency vulnerability scanning (CVE check)
]
# Removed (unused): vcrpy (cassettes were never recorded — the live-API drift canary in
# tests/test_foreup_canary.py replaced them); freezegun (the injectable FakeClock is used
# everywhere instead). See full-repo-scan dependency-hygiene finding.

[project.scripts]
teetime = "teetime.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teetime"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "PL", "ANN"]
ignore = [
    "PLR0913", # too many arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004", "E501"]
# book() is an 11-step sequential payment flow; its branch/statement count is by design.
"src/teetime/courses/teeitup/base.py" = ["PLR0912", "PLR0915"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["teetime"]
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["ntplib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: hits a live external service (skipped by default)",
    "cassette: replays a recorded HTTP cassette",
]

