[project]
name = "teetime"
version = "0.0.0"
description = "Automated tee-time booking bot (v0: Mangrove Bay / ForeUP)."
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Alex Lancaster" }]
license = { text = "Proprietary" }

# Runtime deps. Pinned loosely; lock via uv.lock once `uv sync` is run.
dependencies = [
    "httpx>=0.27",          # async-capable HTTP client; cleaner than requests
    "pydantic>=2.7",        # config + payload validation
    "click>=8.4.2",           # CLI
    # NOT imported directly — idna is transitive via httpx/anyio. Kept here ONLY as a
    # security floor so the resolver can never pick idna<3.15 (CVE-2026-45409, a ReDoS
    # fixed in 3.15). The lock already resolves 3.17, so this is a guard, not load-bearing.
    "idna>=3.18",
    "ntplib>=0.4",          # best-effort NTP clock-offset for the 6 AM race (RealClock)
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.21",          # httpx mock for unit tests
    "ruff>=0.16.1",
    "mypy>=2.3.0",            # 2.x strict defaults verified clean against this codebase
    "pip-audit>=2.10.1",      # dependency vulnerability scanning (CVE check)
]
# Removed (unused): vcrpy (cassettes were never recorded — the live-API drift canary in
# tests/test_foreup_canary.py replaced them); freezegun (the injectable FakeClock is used
# everywhere instead); tenacity (retry is hand-rolled in ForeUpAdapter._send_with_retry);
# structlog (the code uses stdlib logging, not structlog); types-pytz (the code uses
# zoneinfo, never pytz). See full-repo-scan dependency-hygiene finding.
# Removed playwright: the headless-browser reCAPTCHA solver was unreliable (Google's risk
# scorer rejected it) and the deployed image carried no browser binary — 2captcha is the
# only supported live solver now (a missing TWOCAPTCHA_API_KEY fails fast in live mode).

[project.scripts]
teetime = "teetime.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teetime"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "PL", "ANN"]
ignore = [
    "PLR0913", # too many arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004", "E501"]
# book() is an 11-step sequential payment flow; its branch/statement count is by design.
"src/teetime/courses/teeitup/base.py" = ["PLR0912", "PLR0915"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["teetime"]
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["ntplib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: hits a live external service (skipped by default)",
]

