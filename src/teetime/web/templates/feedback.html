{% extends "base.html" %}
{% block title %}{{ heading }} · TeeTimeBooker{% endblock %}
{% block content %}
<h1>{{ heading }}</h1>
<section>
  <form method="post" action="/feedback" class="feedback">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="kind" value="{{ kind }}">
    {% if from_page %}<input type="hidden" name="from" value="{{ from_page }}">{% endif %}
    <label>{{ prompt }}
      <textarea name="message" rows="6" maxlength="{{ max_len }}" required></textarea>
    </label>
    <p class="hint">This goes to Spicy Al by email, with your name and email address so Spicy Al can reply.</p>
    <button type="submit" class="primary">Send</button>
  </form>
</section>
{% endblock %}
